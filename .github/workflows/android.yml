name: Czytam Sam – Android APK

# Buduje aplikację „Czytam Sam” (folder czytam_sam/): zależności, analiza,
# testy, APK, weryfikacja podpisu, artefakt + wydanie z plikiem APK.
on:
  push:
    paths:
      - 'czytam_sam/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # potrzebne tylko do opublikowania wydania z plikiem APK

concurrency:
  group: czytam-sam-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: czytam_sam

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'   # przypięta wersja (ta sama co w testach lokalnych)
          channel: stable
          cache: true

      - name: Zależności (z pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Walidacja materiału dydaktycznego
        run: dart run tool/validate_content.dart

      - name: Analiza statyczna
        run: flutter analyze

      - name: Testy
        run: flutter test --reporter expanded

      - name: Prywatny klucz podpisu (jeśli skonfigurowano Secrets)
        env:
          KS_B64: ${{ secrets.CZYTAMSAM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CZYTAMSAM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=prywatny" >> "$GITHUB_ENV"
          else
            echo "SIGNING=publiczny-testowy" >> "$GITHUB_ENV"
          fi

      - name: Budowa APK
        env:
          CZYTAMSAM_KEYSTORE_PASSWORD: ${{ secrets.CZYTAMSAM_KEYSTORE_PASSWORD }}
          CZYTAMSAM_KEY_ALIAS: ${{ secrets.CZYTAMSAM_KEY_ALIAS }}
          CZYTAMSAM_KEY_PASSWORD: ${{ secrets.CZYTAMSAM_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Weryfikacja APK (podpis, identyfikator, uprawnienia)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee apk-verify.txt
          "$BT/aapt2" dump badging "$APK" | tee apk-badging.txt | head -5
          grep -q "package: name='pl.czytamsam.app'" apk-badging.txt
          if grep -q "android.permission.INTERNET" apk-badging.txt; then
            echo "BŁĄD: APK żąda uprawnienia INTERNET"; exit 1; fi
          grep "uses-permission" apk-badging.txt || true
          sha256sum "$APK" | tee apk-sha256.txt
          mkdir -p out && cp "$APK" out/CzytamSam-${{ github.run_number }}.apk
          cp apk-verify.txt apk-badging.txt apk-sha256.txt out/
          echo "Podpis: $SIGNING" | tee out/podpis.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CzytamSam-apk-${{ github.run_number }}
          path: czytam_sam/out/
          retention-days: 90

      - name: Wydanie z plikiem APK (do pobrania na tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: czytam-sam-build-${{ github.run_number }}
          name: Czytam Sam – wersja ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Plik do instalacji na tablecie: **CzytamSam-${{ github.run_number }}.apk** (poniżej, w sekcji Assets).
            Podpis: ${{ env.SIGNING }}. Szczegóły i ograniczenia: czytam_sam/README_PL.md oraz czytam_sam/RAPORT_ODBIORU.md.
          files: czytam_sam/out/CzytamSam-${{ github.run_number }}.apk
